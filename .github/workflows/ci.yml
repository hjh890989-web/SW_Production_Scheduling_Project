# T11.2/T11.3/T11.4 CI — 코드 5종 게이트(차단) + 의존성 audit prod-high(차단) + E2E 스모크 Playwright(차단).
# 사내 self-hosted runner를 쓰려면 runs-on을 [self-hosted, linux]로 바꾸면 된다(현재는 GitHub-hosted).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: 5종 게이트
    runs-on: ubuntu-latest
    env:
      # 빌드/검증 단계는 실 DB에 접속하지 않음(force-dynamic) — 형식만 갖춘 더미값.
      DATABASE_URL: 'file:./prisma/ci.db'
      AUTH_SECRET: 'ci-dummy-secret-not-used'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Prisma client 생성
        run: npx prisma generate
      - name: 단위 테스트 (vitest)
        run: npm test
      - name: 린트
        run: npm run lint
      - name: 타입체크
        run: npm run typecheck
      - name: Prisma 스키마 검증
        run: npx prisma validate
      - name: 빌드
        run: npm run build

  audit:
    name: 의존성 보안 audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # 차단 게이트: 운영(prod) 의존성에 high+ 취약점이 있으면 실패.
      # xlsx 이관(exceljs) + Next 16 업그레이드로 prod high/critical clean → 자문→차단 승격.
      - name: prod high+ (차단)
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: E2E 스모크 (Playwright)
    runs-on: ubuntu-latest
    env:
      # 시드(npx prisma db seed)와 앱(next start)이 동일 SQLite 파일을 공유 — schema 위치(prisma/) 기준 상대경로.
      DATABASE_URL: 'file:./dev.db'
      AUTH_SECRET: 'ci-e2e-dummy-secret-32-bytes-len-ok!!'
      AUTH_URL: 'http://localhost:3000'
      AUTH_TRUST_HOST: 'true'
      APP_BASE_URL: 'http://localhost:3000'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Prisma client 생성
        run: npx prisma generate
      # 이 프로젝트는 마이그레이션 파일이 없는 schema-first(SQLite) — 시드 전 db push로 스키마 생성.
      - name: DB 스키마 생성 (db push)
        run: npx prisma db push --skip-generate
      - name: DB 시드 (SQLite — 6 사용자·47품번·장비·캘린더)
        run: npx prisma db seed
      - name: Playwright 크로미움 설치
        run: npx playwright install --with-deps chromium
      # E2E는 프로덕션 빌드를 대상으로 한다(playwright webServer가 CI에서 `npm run start` 기동).
      - name: 프로덕션 빌드
        run: npm run build
      - name: E2E 실행 (prod 서버 자동 기동)
        run: npm run test:e2e
      - name: Playwright 리포트 업로드 (실패 시)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
