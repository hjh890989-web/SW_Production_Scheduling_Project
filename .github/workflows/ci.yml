# T11.2/T11.3/T11.4 CI — 코드 5종 게이트(차단) + 의존성 audit(자문).
# 사내 self-hosted runner를 쓰려면 runs-on을 [self-hosted, linux]로 바꾸면 된다(현재는 GitHub-hosted).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: 5종 게이트
    runs-on: ubuntu-latest
    env:
      # 빌드/검증 단계는 실 DB에 접속하지 않음(force-dynamic) — 형식만 갖춘 더미값.
      DATABASE_URL: 'file:./prisma/ci.db'
      AUTH_SECRET: 'ci-dummy-secret-not-used'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Prisma client 생성
        run: npx prisma generate
      - name: 단위 테스트 (vitest)
        run: npm test
      - name: 린트
        run: npm run lint
      - name: 타입체크
        run: npm run typecheck
      - name: Prisma 스키마 검증
        run: npx prisma validate
      - name: 빌드
        run: npm run build

  audit:
    name: 의존성 보안 audit (자문)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # 자문(advisory): xlsx 등 이연 취약점이 있어 차단하지 않는다(잡은 green, 발견 시 warning 주석).
      # 패치/이관 후 `|| echo ...`를 제거해 차단 게이트로 승격할 것(docs/SECURITY_FINDINGS.md).
      - name: npm audit (high+, 자문)
        run: |
          npm audit --audit-level=high \
            || echo "::warning title=의존성 취약점(자문)::npm audit가 high+ 취약점을 보고했습니다 — docs/SECURITY_FINDINGS.md(xlsx 등) 참고, 차단 아님"
