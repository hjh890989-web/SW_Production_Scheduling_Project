# PRD §5.5.2 알림 규칙 (T4.5). 대표 8건.
groups:
  - name: evs-alerts
    rules:
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.01
        for: 5m
        labels: { severity: critical }
        annotations: { summary: '5xx 비율 1% 초과 5분 지속' }

      - alert: AppDown
        expr: up{job="evs-app"} == 0
        for: 1m
        labels: { severity: critical }
        annotations: { summary: 'EVS 앱 스크레이프 실패(다운 의심)' }

      - alert: HighMemory
        expr: process_resident_memory_bytes > 1.5e9
        for: 10m
        labels: { severity: warning }
        annotations: { summary: '상주 메모리 1.5GB 초과' }

      - alert: SlowP95
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1.5
        for: 5m
        labels: { severity: warning }
        annotations: { summary: 'p95 응답 1.5초 초과(NFR §5.1)' }

      - alert: DbConnectionsHigh
        expr: pg_stat_activity_count > 80
        for: 5m
        labels: { severity: warning }
        annotations: { summary: 'DB 연결 수 80 초과' }

      - alert: NoOrdersIngested
        expr: increase(evs_orders_total[1d]) == 0
        for: 1h
        labels: { severity: warning }
        annotations: { summary: '24시간 수주 적재 0건' }

      - alert: UnreadNotificationsSpike
        expr: evs_unread_notifications > 100
        for: 30m
        labels: { severity: info }
        annotations: { summary: '미확인 알림 100건 초과' }

      - alert: KsfSnapshotMissing
        expr: absent(evs_ksf_snapshot_age_seconds) or evs_ksf_snapshot_age_seconds > 172800
        for: 1h
        labels: { severity: warning }
        annotations: { summary: 'KSF 스냅샷 2일 이상 미갱신' }
