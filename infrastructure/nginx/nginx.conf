# EVS nginx 리버스 프록시 (T11.7). TLS 종단 + 사내망 IP 화이트리스트 + app 프록시.
# 인증서: 사내 CA 발급분을 ./certs/evs.crt, ./certs/evs.key 로 배치.
worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  client_max_body_size 30m; # 수주 엑셀 업로드 여유

  # 사내 대역만 허용(외부 IP 노출 금지). 실 대역으로 교체.
  geo $allowed {
    default 0;
    10.0.0.0/8     1;
    172.16.0.0/12  1;
    192.168.0.0/16 1;
  }

  # HTTP → HTTPS 강제
  server {
    listen 80;
    server_name evs.songwoo.local;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name evs.songwoo.local;

    ssl_certificate     /etc/nginx/certs/evs.crt;
    ssl_certificate_key /etc/nginx/certs/evs.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    if ($allowed = 0) { return 403; }

    # Grafana(선택) — /grafana 하위로 프록시
    location /grafana/ {
      proxy_pass http://grafana:3000/;
      proxy_set_header Host $host;
    }

    location / {
      proxy_pass http://app:3000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # AuditLog IP 추적
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }
  }
}
